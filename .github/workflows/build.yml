name: build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  idf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2
          target: esp32
          path: usb_test
